name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate catalog schema
        run: npm run validate:catalog

      - name: Validate permits catalog
        run: npm run validate:permits

      - name: Sitemap matches catalog
        run: |
          git ls-files --error-unmatch public/sitemap.xml public/robots.txt
          npm run sitemap
          git diff --exit-code -I '<lastmod>' -- public/sitemap.xml public/robots.txt

      - name: Validate peak photos (offline check)
        run: npm run validate:photos:check

      - name: Build (index + sitemap + Vite + prerender meta)
        env:
          # Optional MapTiler key — build works with the free tile fallback too.
          VITE_MAPTILER_KEY: ''
          SITE_URL: https://peakatlas3d.com
        run: npm run build

      - name: Verify sitemap and prerender output
        run: |
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/peak/rainier/index.html
          test -f dist/about/index.html
          test -f dist/peaks/index.html
          grep -q "Mt. Rainier" dist/peak/rainier/index.html
          grep -q 'property="og:url"' dist/peak/rainier/index.html
          grep -q "Most glaciated peak" dist/peak/rainier/index.html
          grep -q 'id="seo-prerender"' dist/peak/rainier/index.html
          grep -q '<h1 itemprop="name">Mt. Rainier</h1>' dist/peak/rainier/index.html
          grep -q '/peak/aconcagua' dist/index.html
          grep -q 'https://peakatlas3d.com/peaks' public/sitemap.xml
          grep -q '/countries/philippines' public/sitemap.xml
          grep -q '/countries/malaysia' public/sitemap.xml
          grep -q '/peak/apo' public/sitemap.xml
          grep -q '/peak/kinabalu' public/sitemap.xml
          ! grep -q '/countries/switzerland-italy' public/sitemap.xml
          test -f dist/countries/philippines/index.html
          test -f dist/countries/malaysia/index.html
          test -f dist/countries/switzerland/index.html
          grep -q 'Philippines' dist/countries/philippines/index.html
          grep -q 'Malaysia' dist/countries/malaysia/index.html

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        env:
          VITE_MAPTILER_KEY: ''
        run: npm run test:e2e
